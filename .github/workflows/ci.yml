name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Mã chess-core chép sang Edge Function phải khớp bản gốc
        run: node supabase/functions/sync-shared.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle mobile (web export)
        run: pnpm --filter @erpchess/mobile export:web

  desktop:
    name: Tauri cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài thư viện hệ thống cho Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tạo thư mục frontend giả để cargo check
        run: mkdir -p apps/web/dist && echo '<!doctype html>' > apps/web/dist/index.html
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  engine:
    name: Arasan native + WASM (kết quả phải giống hệt nhau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - name: Build Arasan native (Linux, SSE4.2)
        run: |
          sudo apt-get install -y ninja-build
          node packages/engine/scripts/build-native.mjs modern
      - name: Build Arasan WASM (sse41)
        run: bash packages/engine/wasm/build.sh sse41
      - name: So WASM với native (perft + điểm NNUE)
        run: node packages/engine/wasm/compare.mjs vendor/build/arasan-modern/arasanx-64-modern sse41
      - name: Test engine với bản native và WASM thật
        run: ARASAN_BIN=$PWD/vendor/build/arasan-modern/arasanx-64-modern pnpm --filter @erpchess/engine test
